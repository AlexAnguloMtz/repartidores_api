type: object
properties:
  id:
    type: integer
    format: int64
  titulo:
    type: string
    enum:
      - RECIBIDO
      - RUTA_INICIADA
      - LLEGADA_CENTRO_DESTINO
      - REPARTO_INICIADO
      - ENTREGADO
  descripcion:
    type: string
  fechaHora:
    type: string
    format: date-time
  required:
  - id
  - titulo
  - descripcion
  - fechaHora