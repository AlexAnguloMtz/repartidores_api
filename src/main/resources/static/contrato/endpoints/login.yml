post:
  tags:
    - Autenticación

  description: |
    **Códigos de error:** `BAD_CREDENTIALS`

  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [email, password]
          properties:
            email:
              type: string
            password:
              type: string

  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: '../schema/LoginResponse.yml'