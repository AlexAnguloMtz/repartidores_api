post:
  tags:
    - Autenticación

  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [email, password]
          properties:
            email:
              type: string
            password:
              type: string

  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: '../schema/LoginResponse.yml'

    '400':
      description: Credenciales incorrectas
      content:
        application/problem+json:
          schema:
            oneOf:
              - allOf:
                  - $ref: '../schema/ProblemDetail.yml'
                  - type: object
                    required:
                      - error_code
                    properties:
                      error_code:
                        type: string
                        enum:
                          - BAD_CREDENTIALS