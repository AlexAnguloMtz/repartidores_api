get:

  tags:
    - Centros de Distribucion

  description: |

    **Permisos requeridos:** `ADMINISTRADOR`

  parameters:

    - name: idCentro
      in: query
      required: false
      schema:
        type: array
        items:
          type: integer

    - name: nombre
      in: query
      required: false
      schema:
        type: array
        items:
          type: string

    - name: ciudad
      in: query
      required: false
      schema:
        type: array
        items:
          type: string

    - name: direccion
      in: query
      required: false
      schema:
        type: array
        maxItems: 20
        items:
          type: string
          maxLength: 10

    - name: pageNumber
      in: query
      required: false
      schema:
        type: integer

    - name: pageSize
      in: query
      required: false
      schema:
        type: integer

    - name: sort
      in: query
      required: false
      schema:
        type: string
        enum:
          - idCentro-asc
          - idCentro-desc
          - nombre-asc
          - nombre-desc
          - ciudad-asc
          - ciudad-desc
          - direccion-asc
          - direccion-desc

  responses:
    '200':
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../schema/OffsetPaginationResponse.yml'
              - type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '../schema/CentroDistribucionResponse.yml'

post:

  tags:
    - Centros de Distribucion

  description: |
    
    **Permisos requeridos:** `ADMINISTRADOR`
    
    **Códigos de error:** `NOMBRE_CENTRO_DUPLICADO`

  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../schema/CentroDistribucionRequest.yml'

  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: '../schema/CentroDistribucionResponse.yml'

delete:

  tags:
    - Centros de Distribucion

  description: |

    **Permisos requeridos:** `ADMINISTRADOR`

  parameters:
    - name: idCentro
      in: query
      required: true
      schema:
        type: array
        items:
          type: integer

  responses:
    '200':
      description: Los registros no eliminados tienen recursos asociados que impiden su eliminación.
      content:
        application/json:
          schema:
            type: object
            required:
              - deletedIds
              - notDeletedIds
            properties:
              deletedIds:
                type: array
                items:
                  type: integer
              notDeletedIds:
                type: array
                items:
                  type: integer