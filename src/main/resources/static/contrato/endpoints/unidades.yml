get:

  tags:
    - Unidades

  description: |

    **Permisos requeridos:** `ADMINISTRADOR`

  parameters:

    - name: idUnidad
      in: query
      required: false
      schema:
        type: array
        items:
          type: integer

    - name: idCentro
      in: query
      required: false
      schema:
        type: array
        items:
          type: integer

    - name: codigoUnidad
      in: query
      required: false
      schema:
        type: array
        items:
          type: string

    - name: placas
      in: query
      required: false
      schema:
        type: array
        items:
          type: string

    - name: pageNumber
      in: query
      required: false
      schema:
        type: integer

    - name: pageSize
      in: query
      required: false
      schema:
        type: integer

    - name: sort
      in: query
      required: false
      schema:
        type: string
        enum:
          - idUnidad-asc
          - idUnidad-desc
          - nombreCentro-asc
          - nombreCentro-desc
          - codigoUnidad-asc
          - codigoUnidad-desc
          - placas-asc
          - placas-desc

  responses:
    '200':
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../schema/OffsetPaginationResponse.yml'
              - type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '../schema/UnidadResponse.yml'

post:

  tags:
    - Unidades

  description: |
    
    **Permisos requeridos:** `ADMINISTRADOR`
    
    **Códigos de error:** `CENTRO_NO_ENCONTRADO`

  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../schema/UnidadRequest.yml'

  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: '../schema/UnidadResponse.yml'

delete:

  tags:
    - Unidades

  description: |

    **Permisos requeridos:** `ADMINISTRADOR`

  parameters:
    - name: idUnidad
      in: query
      required: true
      schema:
        type: array
        items:
          type: integer

  responses:
    '200':
      description: Eliminado correctamente